services:
  app:
    build: .
    ports:
      - "8080:3000"
    environment:
      APP_ENV: production
      DB_HOST: postgreSQL
    depends_on:
      - postgreSQL
  postgreSQL:
    image: postgres:16-alpine
    volumes:
      - postgreSQL_volume:/var/lib/postgresql/data
volumes:
  postgreSQL_volume:
